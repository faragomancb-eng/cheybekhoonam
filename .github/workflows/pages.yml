name: انتشار در GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * *'   # هر روز: خلاصه‌ی کتاب‌های تازه (هر بار تا ۶۰۰ کتاب) و نوشته‌های فراگمان
  workflow_dispatch:

permissions:
  contents: write   # برای ذخیره‌ی خلاصه‌های دریافت‌شده در خود مخزن
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: بررسی فایل کتاب‌ها
        run: npm run validate
      - name: آزمون‌ها
        run: npm test
      - name: دریافت خلاصه‌ها و تازه‌های فراگمان
        run: npm run prefetch
        continue-on-error: true
        env:
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
      - name: ذخیره‌ی خلاصه‌ها در مخزن
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A data/summaries data/covers.json data/feed.json
          git rm -q --cached --ignore-unmatch data/summaries.json
          git diff --cached --quiet || (git commit -m "به‌روزرسانی خلاصه‌ها و تازه‌ها" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
