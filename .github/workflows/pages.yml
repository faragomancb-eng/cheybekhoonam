name: انتشار در GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * 1'   # هر دوشنبه: خلاصه‌های کتاب‌های تازه و نوشته‌های فراگمان به‌روز می‌شوند
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: بررسی فایل کتاب‌ها
        run: npm run validate
      - name: آزمون‌ها
        run: npm test
      - name: دریافت خلاصه‌ها و تازه‌های فراگمان
        run: npm run prefetch
        continue-on-error: true
        env:
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
